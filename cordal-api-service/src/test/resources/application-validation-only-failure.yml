server:
  host: localhost
  port: 18080

database:
  url: jdbc:h2:mem:validation-failure;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  username: sa
  password: ""
  driver: org.h2.Driver

swagger:
  enabled: false
  path: /swagger

config:
  source: yaml
  loadFromYaml: false
  paths:
    databases: "validation-empty-databases.yml"
    queries: "validation-empty-queries.yml"
    endpoints: "validation-broken-endpoints.yml"

validation:
  runOnStartup: false
  validateOnly: true
  validateEndpoints: false